[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ironwall"
version = "0.1.0"
description = "Open-source anti-cheat protocol stack — thin client, TEE attestation, Hedera HCS, ZK-SNARKs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42",
    "hedera-sdk-py>=2.0",
    "pyjwt>=2.8",
    "web3>=6.0",
    "xrpl-py>=3.0",
]

[project.scripts]
ironwall-verify = "ironwall.cli.verify:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "isort>=5.13",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ['.']
include = ['ironwall*']
