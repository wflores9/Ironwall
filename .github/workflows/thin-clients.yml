name: Thin Clients CI

on:
  push:
    branches: [main]
    paths:
      - 'rust-thin-client/**'
      - 'cpp-thin-client/**'
      - '.github/workflows/thin-clients.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rust-thin-client/**'
      - 'cpp-thin-client/**'

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust-thin-client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --all-targets
      - name: Test
        run: cargo test --release
      - name: Smoke thin client
        run: cargo run --release --bin ironwall_thin_client
      - name: Smoke verifier
        run: cargo run --release --bin ironwall_verifier

  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # windows-latest needs MSVC generator tweaks; add later
    defaults:
      run:
        working-directory: cpp-thin-client
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ build-essential

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Smoke thin client
        run: ./build/ironwall_thin_client

      - name: Smoke verifier
        run: ./build/ironwall_verifier

      - name: Upload lib artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ironwall-lib-${{ matrix.os }}
          path: |
            cpp-thin-client/build/libironwall.a
            cpp-thin-client/build/libironwall.so
            cpp-thin-client/build/libironwall.dylib
          if-no-files-found: ignore
