[package]
name = "ironwall_thin_client"
version = "0.1.0"
edition = "2021"
description = "Ironwall open-source anti-cheat protocol stack - thin client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ironwall-protocol/ironwall"
authors = ["Ironwall Contributors"]
readme = "README.md"
keywords = ["anti-cheat", "tee", "zk-snark", "hedera", "xrpl", "gaming"]
categories = ["game-development", "cryptography", "security"]

[lib]
name = "ironwall"
path = "src/lib.rs"

[[bin]]
name = "ironwall_thin_client"
path = "src/main.rs"

[[bin]]
name = "ironwall_verifier"
path = "src/bin/verifier.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"
hmac = "0.12"
blake3 = "1.5"
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
